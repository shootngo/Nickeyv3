<!-- AI Assistant Floating Button -->
<div id="aiFab" onclick="toggleAIChat()" title="AI Dispatch Assistant" style="position: fixed; bottom: 24px; right: 24px; width: 58px; height: 58px; background: linear-gradient(135deg, #1e3a8a, #ffd700); border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 999; border: 3px solid #fff; font-size: 26px; color: white; user-select: none;">
    🤖
</div>

<!-- AI Chat Overlay -->
<div id="aiChatOverlay" class="overlay" style="display: none; z-index: 300;">
    <div class="overlay-content" style="max-width: 420px; height: 520px; display: flex; flex-direction: column; border: 2px solid #ffd700; border-radius: 16px; overflow: hidden;">
        
        <!-- Header -->
        <div style="background: #1e3a8a; color: white; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 22px;">🤖</span>
                <div>
                    <div style="font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px;">AI DISPATCH ASSISTANT</div>
                    <div style="font-size: 11px; opacity: 0.8;">Nickey Pro • Powered by your OpenAI key</div>
                </div>
            </div>
            <div onclick="toggleAIChat()" style="cursor: pointer; font-size: 26px; line-height: 1; padding: 0 6px;">&times;</div>
        </div>

        <!-- Chat Messages -->
        <div id="aiChatMessages" style="flex: 1; padding: 16px; overflow-y: auto; background: #1a1a1a; display: flex; flex-direction: column; gap: 12px; font-size: 14px;">
            <!-- Messages will be added here by JS -->
            <div style="color: #aaa; font-size: 13px; text-align: center; padding: 20px 10px;">
                Hi! I'm your AI helper for dispatching, pay, safety, and more.<br>
                Ask me anything or tell me what to fill in.
            </div>
        </div>

        <!-- Input Area -->
        <div style="padding: 12px; background: #252525; border-top: 1px solid #444; flex-shrink: 0;">
            <div style="display: flex; gap: 8px;">
                <input id="aiChatInput" type="text" placeholder="Type a message... (e.g. fill form for Pilgrim's load)" 
                       style="flex: 1; padding: 12px 14px; border: 1px solid #555; border-radius: 999px; background: #1a1a1a; color: white; font-size: 14px;"
                       onkeypress="if (event.key === 'Enter') sendAIMessage()">
                <button onclick="sendAIMessage()" 
                        style="background: #1e3a8a; color: white; border: none; padding: 0 20px; border-radius: 999px; font-weight: bold; cursor: pointer;">
                    Send
                </button>
            </div>
            <div style="font-size: 10px; color: #777; text-align: center; margin-top: 6px;">
                Your API key is stored only on this device
            </div>
        </div>
    </div>
</div>
